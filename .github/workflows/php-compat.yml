name: PHP 8 compatibility

on:
  push:
    branches: [master, 'fix/**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
      - name: PHP syntax and smoke tests
        run: |
          php -l src/Chart.php
          php -l src/Chartwidget.php
          php -l src/ChartAssetsBundle.php
          php -l tests/smoke.php
          php tests/smoke.php
